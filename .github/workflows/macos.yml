name: Build Fritzing on macOS

# Called from build.yml, which reads the dependency versions from fritzing-app and publishes the release.
on:
  workflow_call:
    inputs:
      fritzing_ver:
        required: true
        type: string
      pri_hash:
        required: true
        type: string
      libgit2_version:
        required: true
        type: string
      quazip_version:
        required: true
        type: string
      clipper_version:
        required: true
        type: string
      svgpp_version:
        required: true
        type: string
      ngspice_version:
        required: true
        type: string
      boost_version:
        required: true
        type: string
      boost_dir:
        required: true
        type: string

env:
  QT_VERSION: '6.8.2'
  FRITZING_VER: ${{ inputs.fritzing_ver }}
  LIBGIT2_VERSION: ${{ inputs.libgit2_version }}
  QUAZIP_VERSION: ${{ inputs.quazip_version }}
  CLIPPER_VERSION: ${{ inputs.clipper_version }}
  SVGPP_VERSION: ${{ inputs.svgpp_version }}
  NGSPICE_VERSION: ${{ inputs.ngspice_version }}
  BOOST_VERSION: ${{ inputs.boost_version }}
  BOOST_DIR: ${{ inputs.boost_dir }}

jobs:
  build:
    name: Build on macOS (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Qt 6.8.2 does not build on the macOS 26 SDK (missing AGL framework, __yield in qyieldcpu.h)
        include:
          - os: macos-15
            arch: arm64
            name: Apple Silicon (ARM64)
          - os: macos-15-intel
            arch: x86_64
            name: Intel (x86_64)

    steps:
      # Checkout repositories
      - name: Checkout fritzing-build
        uses: actions/checkout@v7
        with:
          path: fritzing-build

      - name: Checkout fritzing-app
        uses: actions/checkout@v7
        with:
          repository: fritzing/fritzing-app
          ref: develop
          path: fritzing-app

      - name: Checkout fritzing-parts
        uses: actions/checkout@v7
        with:
          repository: fritzing/fritzing-parts
          ref: develop
          path: fritzing-parts

      # Install System Dependencies
      - name: Install System Dependencies
        run: |
          brew install cmake ninja p7zip libngspice

      # Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtserialport qt5compat'
          cache: true

      # Cache built dependencies (key changes whenever fritzing-app changes what it expects)
      - name: Cache dependencies
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: |
            libgit2-${{ env.LIBGIT2_VERSION }}
            quazip-${{ env.QT_VERSION }}-${{ env.QUAZIP_VERSION }}intuisphere
            Clipper1-${{ env.CLIPPER_VERSION }}
            ${{ env.BOOST_DIR }}
            svgpp-${{ env.SVGPP_VERSION }}
            ngspice-${{ env.NGSPICE_VERSION }}
          key: macos-deps-v5-${{ env.QT_VERSION }}-${{ matrix.arch }}-${{ inputs.pri_hash }}

      # Build libgit2 (static)
      - name: Build libgit2
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v$LIBGIT2_VERSION" https://github.com/libgit2/libgit2.git "libgit2-$LIBGIT2_VERSION"
          cd "libgit2-$LIBGIT2_VERSION"
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DUSE_SSH=OFF \
            -DUSE_NTLMCLIENT=OFF \
            -DUSE_BUNDLED_ZLIB=OFF \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build build -j$(sysctl -n hw.ncpu)
          mkdir -p lib
          find build -name "libgit2.a" -exec cp {} lib/libgit2.a \;

      # Build QuaZip
      - name: Build QuaZip
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -f -o quazip.tar.gz "https://github.com/stachenov/quazip/archive/refs/tags/v$QUAZIP_VERSION.tar.gz"
          tar -xzf quazip.tar.gz
          cd "quazip-$QUAZIP_VERSION"
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DQUAZIP_QT_MAJOR_VERSION=6 \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build build -j$(sysctl -n hw.ncpu)
          cd ..

          TARGET_DIR="quazip-$QT_VERSION-${QUAZIP_VERSION}intuisphere"
          mkdir -p "$TARGET_DIR/lib"
          mkdir -p "$TARGET_DIR/include/QuaZip-Qt6-$QUAZIP_VERSION/quazip"

          find "quazip-$QUAZIP_VERSION/build" -name "*.dylib" -exec cp {} "$TARGET_DIR/lib/" \;
          cp "quazip-$QUAZIP_VERSION"/quazip/*.h "$TARGET_DIR/include/QuaZip-Qt6-$QUAZIP_VERSION/"
          cp "quazip-$QUAZIP_VERSION"/quazip/*.h "$TARGET_DIR/include/QuaZip-Qt6-$QUAZIP_VERSION/quazip/"

      # Build Clipper
      - name: Download and build Clipper
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          DIR="Clipper1-$CLIPPER_VERSION"
          curl -L -f -o clipper.zip "https://sourceforge.net/projects/polyclipping/files/clipper_ver$CLIPPER_VERSION.zip/download"
          unzip -q clipper.zip -d clipper-src
          mkdir -p "$DIR/lib" "$DIR/include/polyclipping"

          CPP_FILE=$(find clipper-src -name "clipper.cpp" | head -n 1)
          HPP_FILE=$(find clipper-src -name "clipper.hpp" | head -n 1)
          cp "$HPP_FILE" "$DIR/include/polyclipping/"
          cp "$HPP_FILE" "$DIR/include/"

          clang++ -arch ${{ matrix.arch }} -O3 -fPIC -c "$CPP_FILE" -I "$DIR/include/polyclipping" -o clipper.o
          ar rcs "$DIR/lib/libpolyclipping.a" clipper.o
          rm -rf clipper.o clipper-src clipper.zip

      # Download Boost & SVG++
      - name: Download Boost and SVG++
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -f "https://archives.boost.io/release/$BOOST_VERSION/source/$BOOST_DIR.tar.gz" | tar -xz
          curl -L -f "https://github.com/svgpp/svgpp/archive/refs/tags/v$SVGPP_VERSION.tar.gz" | tar -xz

      # Setup ngspice (Homebrew's libngspice, laid out the way fritzing-app expects)
      - name: Setup ngspice headers and library
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          NGSPICE_PREFIX=$(brew --prefix libngspice)
          DIR="ngspice-$NGSPICE_VERSION"
          mkdir -p "$DIR/include" "$DIR/lib"
          cp -R "$NGSPICE_PREFIX/include/"* "$DIR/include/"
          find "$NGSPICE_PREFIX/lib" -name "libngspice*.dylib" -exec cp {} "$DIR/lib/" \;

      # Fail early, with a clear message, if a dependency is not where fritzing-app looks
      - name: Verify dependency layout
        run: |
          missing=0
          for f in \
            "libgit2-$LIBGIT2_VERSION/include/git2.h" \
            "libgit2-$LIBGIT2_VERSION/lib/libgit2.a" \
            "quazip-$QT_VERSION-${QUAZIP_VERSION}intuisphere/include/QuaZip-Qt6-$QUAZIP_VERSION/quazip/quazip.h" \
            "Clipper1-$CLIPPER_VERSION/lib/libpolyclipping.a" \
            "$BOOST_DIR/boost/version.hpp" \
            "svgpp-$SVGPP_VERSION/include/svgpp/svgpp.hpp" \
            "ngspice-$NGSPICE_VERSION/include/ngspice/sharedspice.h"; do
            if [ -e "$f" ]; then echo "ok       $f"; else echo "MISSING  $f"; missing=1; fi
          done
          ls "quazip-$QT_VERSION-${QUAZIP_VERSION}intuisphere/lib/"*.dylib || missing=1
          exit $missing

      # Configure & Build Fritzing
      - name: Configure Fritzing (qmake)
        working-directory: fritzing-app
        run: |
          ARCH=$(uname -m)
          # Ensure QMAKE_APPLE_DEVICE_ARCHS matches the runner architecture exactly
          sed -i.bak "s/QMAKE_APPLE_DEVICE_ARCHS = .*/QMAKE_APPLE_DEVICE_ARCHS = $ARCH/" phoenix.pro
          qmake phoenix.pro "CONFIG+=release"

      - name: Build Fritzing (make)
        working-directory: fritzing-app
        run: |
          make release -j$(sysctl -n hw.ncpu) || make -j$(sysctl -n hw.ncpu)


      # Bundle Third-Party Assets & Deploy Qt
      - name: Bundle Assets and Package App
        run: |
          APP_PATH="release64/Fritzing.app"
          RES_PATH="$APP_PATH/Contents/Resources"
          FRAMEWORKS_PATH="$APP_PATH/Contents/Frameworks"

          mkdir -p "$RES_PATH" "$FRAMEWORKS_PATH"

          # Copy runtime assets required by Fritzing
          cp -R fritzing-app/help "$RES_PATH/"
          cp -R fritzing-app/sketches "$RES_PATH/"
          cp -R fritzing-app/translations "$RES_PATH/"

          # Like upstream's deploy_fritzing_mac.sh: licence texts travel with the binaries (GPL, plus the
          # LGPL Qt and QuaZip libraries), and only the compiled translations are needed at runtime
          cp fritzing-app/LICENSE* fritzing-app/README.md fritzing-app/INSTALL.txt "$RES_PATH/"
          rm -f "$RES_PATH"/translations/*.ts
          find "$RES_PATH/translations" -name "*.qm" -size -128c -delete
          cp -R fritzing-parts "$RES_PATH/parts"

          # Copy extra dynamic libraries into app bundle
          cp quazip-${{ env.QT_VERSION }}-${{ env.QUAZIP_VERSION }}intuisphere/lib/*.dylib "$FRAMEWORKS_PATH/" || true
          cp ngspice-${{ env.NGSPICE_VERSION }}/lib/*.dylib "$FRAMEWORKS_PATH/" 2>/dev/null || true

          # Deploy Qt frameworks
          macdeployqt "$APP_PATH" -always-overwrite

          # Pre-build parts.db. Without it Fritzing regenerates it on first launch, which needs
          # write access to the app bundle and a git repo libgit2 accepts; either failing leaves
          # an empty parts bin.
          PARTS="$PWD/$RES_PATH/parts"
          "$APP_PATH/Contents/MacOS/Fritzing" -pp "$PARTS" -db "$PARTS/parts.db" &
          PID=$!
          for _ in $(seq 1 180); do
            kill -0 $PID 2>/dev/null || break
            sleep 5
          done
          if kill -0 $PID 2>/dev/null; then
            kill $PID
            echo "Timed out generating parts.db"
            exit 1
          fi
          wait $PID || true
          if [ ! -s "$PARTS/parts.db" ] || [ "$(stat -f%z "$PARTS/parts.db")" -lt 1000000 ]; then
            echo "parts.db was not generated"
            exit 1
          fi
          echo "parts.db: $(stat -f%z "$PARTS/parts.db") bytes"

          ARCH=$(uname -m)
          DMG_NAME="Fritzing-${{ env.FRITZING_VER }}-macOS-${ARCH}.dmg"
          ZIP_NAME="Fritzing-${{ env.FRITZING_VER }}-macOS-${ARCH}.zip"

          # Create DMG image
          hdiutil create -volname "Fritzing" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_NAME"
          echo "DMG_FILE=$DMG_NAME" >> $GITHUB_ENV

          # Create ZIP archive (preserves symlinks and macOS metadata)
          cd release64
          ditto -c -k --keepParent Fritzing.app "../$ZIP_NAME"
          cd ..
          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV

      # The release job in build.yml publishes these
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            ${{ env.DMG_FILE }}
            ${{ env.ZIP_FILE }}
